<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Вчи англійську через улюблені пісні: рядок за рядком, караоке з пропусками, слова з пам'яті.">
<title>Рядок за рядком</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one narrow column (phone first), sticky action bar at the bottom of lesson screens; the song is a vinyl disc that fills with progress. */
:root {
  --bg: #F3F4FA;
  --surface: #FFFFFF;
  --ink: #1A1D3A;
  --muted: #646a8f;
  --line: #E1E3F0;
  --accent: #3552F2;
  --accent-deep: #2337B8;
  --on-accent: #FFFFFF;
  --sun: #FFB21E;
  --sun-deep: #D98D00;
  --chip: #EBEEFF;
  --good: #0E9C62;
  --good-bg: #DAF5E8;
  --bad: #D93A40;
  --bad-bg: #FCE3E3;
  --on-good: #FFFFFF;
  --on-bad: #FFFFFF;
  --disc: #1A1D3A;
  --disc-groove: #2B2F55;
  --font-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1126; --surface: #1A1D3B; --ink: #F0F1FA; --muted: #A3A8CC; --line: #2C3061;
    --accent: #6C83FF; --accent-deep: #3A4DC2; --on-accent: #FFFFFF; --sun: #FFC23D; --sun-deep: #B98000;
    --chip: #252A57; --good: #3DD68C; --good-bg: #123828; --bad: #FF6D70; --bad-bg: #3D1B22; --on-good: #06281A; --on-bad: #2E0A0D;
    --disc: #070818; --disc-groove: #1C1F43; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1126; --surface: #1A1D3B; --ink: #F0F1FA; --muted: #A3A8CC; --line: #2C3061;
  --accent: #6C83FF; --accent-deep: #3A4DC2; --on-accent: #FFFFFF; --sun: #FFC23D; --sun-deep: #B98000;
  --chip: #252A57; --good: #3DD68C; --good-bg: #123828; --bad: #FF6D70; --bad-bg: #3D1B22; --on-good: #06281A; --on-bad: #2E0A0D;
  --disc: #070818; --disc-groove: #1C1F43; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45; }
#app { max-width: 520px; margin: 0 auto; padding-block: 16px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 22px; font-weight: 800; }
h2 { font-size: 19px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.label { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.brand span { color: var(--accent); }
.badge { font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.on { color: var(--good); background: var(--good-bg); }

button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.btn { appearance: none; border: 0; border-radius: 16px; padding: 15px 18px; width: 100%; font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: .02em; background: var(--accent); color: var(--on-accent); box-shadow: 0 4px 0 var(--accent-deep); transition: transform .06s, box-shadow .06s; }
.btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-deep); }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
.btn.sun { background: var(--sun); color: #2A1A00; box-shadow: 0 4px 0 var(--sun-deep); }
.btn.sun:active { box-shadow: 0 0 0 var(--sun-deep); }
.btn.ghost { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 0 0 var(--line); }
.btn.good { background: var(--good); color: var(--on-good); box-shadow: 0 4px 0 color-mix(in srgb, var(--good) 60%, #000); }
.btn.bad { background: var(--bad); color: var(--on-bad); box-shadow: 0 4px 0 color-mix(in srgb, var(--bad) 60%, #000); }
.btn.sm { width: auto; padding: 10px 14px; font-size: 13px; }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 800; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

input[type=text], textarea { width: 100%; font: inherit; font-size: 17px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; }
textarea { min-height: 180px; resize: vertical; font-size: 15px; }
input[type=text]:focus, textarea:focus { border-color: var(--accent); outline: none; }

/* Home: vinyl */
.hero { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center; }
.disc { width: 132px; aspect-ratio: 1; max-width: 100%; border-radius: 50%; position: relative; background:
  radial-gradient(circle, var(--sun) 0 17%, var(--disc) 17.5% 20%, transparent 20.5%),
  repeating-radial-gradient(circle, var(--disc) 0 3px, var(--disc-groove) 3px 4px); box-shadow: 0 6px 0 var(--line); }
.disc::before { content: ""; position: absolute; inset: -7px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); -webkit-mask: radial-gradient(circle, transparent 66px, #000 67px); mask: radial-gradient(circle, transparent 66px, #000 67px); }
.disc::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--disc); }
.pct { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pct small { font-size: 22px; }
.songname { font-weight: 800; font-size: 17px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-size: 13px; font-weight: 700; background: var(--chip); border-radius: 99px; padding: 3px 10px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 700; }
.wordlist { display: flex; flex-direction: column; }
.wordrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.wordrow:last-child { border-bottom: 0; }
.dots { display: flex; gap: 3px; align-items: center; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.f { background: var(--good); }
details > summary { cursor: pointer; font-weight: 800; list-style: none; display: flex; justify-content: space-between; align-items: center; }
details > summary::after { content: "+"; font-family: var(--font-display); color: var(--muted); }
details[open] > summary::after { content: "–"; }
details > summary::-webkit-details-marker { display: none; }
.lessons-left { font-size: 14px; font-weight: 700; color: var(--muted); text-align: center; }

/* Lesson */
.lessonbar { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 6px; z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.x { width: 40px; height: 40px; flex: none; border-radius: 12px; border: 0; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; }
.track { flex: 1; height: 14px; border-radius: 99px; background: var(--line); overflow: hidden; }
.track > div { height: 100%; background: var(--sun); border-radius: 99px; transition: width .35s ease; box-shadow: inset 0 -4px 0 rgba(0,0,0,.08); }
.kind { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.bigword { font-family: var(--font-display); font-size: 34px; font-weight: 800; letter-spacing: -.01em; overflow-wrap: anywhere; }
.say { font-weight: 800; color: var(--muted); }
.lyric { font-family: var(--font-display); font-weight: 600; font-size: 21px; line-height: 1.5; overflow-wrap: anywhere; }
.lyric.prev { font-size: 17px; color: var(--muted); }
.tr { font-size: 17px; font-weight: 700; }
.note { background: var(--chip); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 7px 12px; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 var(--line); }
.chip .tip { display: block; font-weight: 700; font-size: 13px; color: var(--accent); }
.speak { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--chip); color: var(--accent); border-radius: 12px; padding: 9px 14px; font-weight: 800; }
.speak svg { width: 20px; height: 20px; }
.gap { display: inline-block; font: inherit; font-size: 18px; font-family: var(--font-body); font-weight: 800; color: var(--accent); background: var(--chip); border: 0; border-bottom: 3px solid var(--accent); border-radius: 8px 8px 0 0; padding: 0 6px; margin: 2px 0; min-width: 3.2em; text-align: center; vertical-align: baseline; }
.gap:focus { outline: none; background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
.gap.ok { color: var(--good); border-color: var(--good); background: var(--good-bg); }
.gap.no { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); text-decoration: line-through; }
.fix { color: var(--good); font-weight: 800; font-family: var(--font-body); font-size: 16px; }
.sungline .w { display: inline-block; padding: 0 3px; border-radius: 6px; margin: 1px 0; }
.sungline .w.hit { background: var(--good-bg); color: var(--good); }
.sungline .w.miss { color: var(--muted); text-decoration: underline wavy var(--bad); text-underline-offset: 5px; }
.mic { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: 0 5px 0 var(--accent-deep); display: grid; place-items: center; margin: 4px auto; }
.mic svg { width: 40px; height: 40px; }
.mic.live { background: var(--bad); box-shadow: 0 0 0 10px color-mix(in srgb, var(--bad) 25%, transparent); animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 18px color-mix(in srgb, var(--bad) 10%, transparent); } }
.heard { min-height: 1.5em; text-align: center; color: var(--muted); font-style: italic; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding-block: 14px calc(14px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--surface); border-top: 2px solid var(--line); }
.actionbar.ok { background: var(--good-bg); border-color: transparent; }
.actionbar.no { background: var(--bad-bg); border-color: transparent; }
.actionbar .in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
.verdict { font-family: var(--font-display); font-weight: 800; font-size: 17px; }
.actionbar.ok .verdict { color: var(--good); }
.actionbar.no .verdict { color: var(--bad); }
.resultpct { text-align: center; }
.resultpct .pct { font-size: 56px; }
.delta { font-family: var(--font-display); font-weight: 800; color: var(--good); font-size: 20px; }
.progressline { height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progressline > div { height: 100%; background: var(--accent); transition: width .3s; }
.warn { background: var(--bad-bg); color: var(--ink); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.okbox { background: var(--good-bg); border-radius: 14px; padding: 10px 12px; font-size: 15px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; white-space: pre-wrap; background: var(--chip); border-radius: 12px; padding: 10px; max-height: 160px; overflow: auto; }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media (max-width: 360px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .facts { justify-content: center; } }
/* v2 additions */
.hinted { box-shadow: 0 0 0 3px var(--sun) !important; }
.gap.retry { color: var(--ink); border-color: var(--sun-deep); background: color-mix(in srgb, var(--sun) 22%, var(--surface)); }
.diff { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .04em; }
.diff .x { color: var(--bad); text-decoration: underline 3px; text-underline-offset: 5px; }
.diff .gone { color: var(--bad); }
.diff .extra { color: var(--bad); text-decoration: line-through; }
.hintbox { background: color-mix(in srgb, var(--sun) 20%, var(--surface)); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 16px; padding: 14px 16px; font-weight: 800; font-size: 18px; box-shadow: 0 4px 0 var(--line); transition: transform .06s, box-shadow .06s; }
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.ok { border-color: var(--good); background: var(--good-bg); color: var(--good); box-shadow: 0 4px 0 var(--good); }
.opt.no { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); box-shadow: 0 4px 0 var(--bad); }
.opt:disabled { cursor: default; }
.slots { min-height: 62px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding-bottom: 10px; border-bottom: 2px dashed var(--line); }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 9px 13px; font-weight: 800; font-size: 17px; box-shadow: 0 3px 0 var(--line); }
.tile.used { visibility: hidden; }
.tile.ok { border-color: var(--good); color: var(--good); }
.tile.no { border-color: var(--bad); color: var(--bad); }
.fixed { color: var(--muted); font-weight: 700; }
.kw { transition: color .15s; }
.kw.on { color: var(--accent); }
.audiorow { display: flex; flex-wrap: wrap; gap: 8px; }
.speak.on { background: var(--accent); color: var(--on-accent); }
.playbig { width: 104px; height: 104px; border-radius: 28px; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: 0 5px 0 var(--accent-deep); display: grid; place-items: center; margin: 4px auto; }
.playbig svg { width: 46px; height: 46px; }
.playbig:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-deep); }
.parts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.part { border: 2px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 10px; padding: 6px 10px; font-weight: 800; font-size: 18px; display: inline-flex; flex-direction: column; align-items: center; line-height: 1.15; }
.part small { font-size: 12px; color: var(--accent); font-weight: 800; }
.part.on { border-color: var(--accent); }
.plus { color: var(--muted); font-weight: 800; }
.audiocard input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.filelabel { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
.syncnow { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.4; overflow-wrap: anywhere; }
.syncnext { color: var(--muted); font-weight: 700; }
.syncprev { color: var(--good); font-weight: 700; font-size: 14px; }
.tapbtn { min-height: 120px; font-size: 18px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--muted); }
.adj { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-weight: 700; }
.adj button { border: 2px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 4px 10px; font-weight: 800; }

#ytbox { max-width: 520px; margin: 0 auto; padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#ytbox .frame { width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; }
#ytbox .frame iframe, #ytbox .frame > div { width: 100%; height: 100%; display: block; border: 0; }
.chip.chipon { border-color: var(--accent); color: var(--accent); }
.klyrics { gap: 10px; }
.kl { font-family: var(--font-display); font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
.kl.prev { font-size: 15px; color: var(--muted); }
.kl.next { font-size: 16px; color: var(--muted); }
.kl.cur { font-size: 22px; }
.kl .kok { color: var(--good); }
.kl .kno { color: var(--bad); text-decoration: underline wavy var(--bad); text-underline-offset: 5px; }
.kl .kblank { color: var(--muted); letter-spacing: .05em; }
.lessonbar { position: static; }
</style>
</head>
<body>
<div id="ytbox" hidden><div class="frame"><div id="yt"></div></div></div>
<div id="app"></div>
<div id="bar" class="actionbar" hidden><div class="in" id="barin"></div></div>
<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const app = document.getElementById("app");
const bar = document.getElementById("bar");
const barin = document.getElementById("barin");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const DAY = 86400000;
const INTERVALS = [1, 3, 7, 14, 30];
const fmtPct = v => (Math.floor(v * 10) / 10).toFixed(1).replace(".", ",");
const ymd = t => { const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtTime = t => { t = Math.max(0, t || 0); return Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0"); };
const ICON_SPEAK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
const ICON_MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>';

function norm(s) { return String(s || "").toLowerCase().replace(/[’‘`´]/g, "'").replace(/[^a-z0-9' ]+/g, " ").replace(/\s+/g, " ").trim(); }
function toks(s) { return (norm(s).match(/[a-z0-9']+/g) || []).map(w => w.replace(/^'+|'+$/g, "")).filter(Boolean); }
const clean = s => norm(s).replace(/'/g, "").replace(/\s+/g, "");
function lev(a, b) {
  if (a === b) return 0;
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
  return prev[n];
}
function same(a, b) { a = clean(a); b = clean(b); return !!a && a === b; }
function near(a, b) { a = clean(a); b = clean(b); if (!a || !b) return false; return lev(a, b) <= Math.max(1, Math.round(b.length / 4)); }

  if (!r) r = S.words[k] = { song: sid, w: wobj.w, ua: wobj.ua, say: wobj.say, line: lineIdx, stage: 0, due: 0, right: 0, wrong: 0 };
  if (ok) { r.stage = Math.min(INTERVALS.length, r.stage + 1); r.right++; r.due = Date.now() + (soon ? 1 : INTERVALS[r.stage - 1]) * DAY - 3600000; }
  else { r.stage = Math.max(0, r.stage - 1); r.wrong++; r.due = Date.now() + DAY - 3600000; }
  const song = S.songs[sid];
  if (song) { if (ok) song.ws[wobj.w] = Math.max(song.ws[wobj.w] || 0, Math.min(1, r.stage / 4)); else bumpWord(song, wobj.w, -0.1); }
}
function dueWords() { const now = Date.now(); return Object.values(S.words).filter(r => r.due <= now && S.songs[r.song]).sort((a, b) => a.due - b.due); }
function bumpStreak() {
  const today = ymd(Date.now()), yest = ymd(Date.now() - DAY);
  if (S.streak.last === today) return;
  S.streak.n = S.streak.last === yest ? S.streak.n + 1 : 1; S.streak.last = today;
}
function streakNow() { const t = ymd(Date.now()), y = ymd(Date.now() - DAY); return (S.streak.last === t || S.streak.last === y) ? S.streak.n : 0; }
function wordObj(song, w) { for (const l of song.lines) for (const x of l.words) if (x.w === w) return x; const r = S.words[wkey(song.id, w)]; return r ? { w: r.w, ua: r.ua, say: r.say } : { w, ua: "", say: "" }; }

function renderTranslate(song, later) {
  VIEW = "setup"; hideBar(); showPlayer(false);
  const keep = later ? song.lines.map((l, i) => (song.lp[i] && song.lp[i].sessions) ? l.words.slice() : null) : null;
  const done = () => {
    if (keep) song.lines.forEach((l, i) => { if (keep[i]) { const fresh = l.words; l.words = keep[i].map(w => { const f = fresh.find(x => x.w === w.w); return f ? Object.assign({}, w, { ua: f.ua || w.ua, say: f.say || w.say }) : w; }); } });
    finishSong(song);
  };
  app.innerHTML = `
  <div class="topbar"><div class="brand">Рядок <span>за</span> рядком</div></div>
  <div class="stack"><h1>Переклад</h1><p class="muted">${esc(song.artist)} — ${esc(song.title)}: ${song.lines.length} рядків для уроків, ${song.total} слів. ШІ перекладе кожен рядок, пояснить сленг і вибере 1–3 слова з рядка.</p></div>
  <div class="card">
    ${SAMPLE ? `<button class="btn" id="ai">Перекласти через ШІ (ключ API)</button>` : `<p class="small muted">Найпростіше: скопіюй запит у свій чат з Claude чи ChatGPT і встав відповідь. Або додай ключ Claude API в налаштуваннях, і переклад буде в один тап.</p>`}
    <button class="btn ghost" id="manualbtn">Через чат з ШІ (скопіювати запит)</button>
    <button class="linkbtn" id="skip" style="align-self:flex-start">${later ? "Скасувати" : "Пропустити, перекласти пізніше"}</button>
  </div>
  <div id="manual"></div>`;
  document.getElementById("skip").onclick = () => { if (later) route(); else finishSong(song); };
  document.getElementById("manualbtn").onclick = () => showManual(song, "", done);
  const ai = document.getElementById("ai");
  if (ai) ai.onclick = async () => {
    ai.disabled = true; const chosen = new Set(); const CH = 10;
    try {
      for (let from = 0; from < song.lines.length; from += CH) {
        const to = Math.min(song.lines.length, from + CH);
        ai.textContent = `Перекладаю рядки ${from + 1}–${to} з ${song.lines.length}…`;
        applyAI(song, await SAMPLE.json(buildPrompt(song, from, to, chosen), { modelTier: "default" }), chosen);
      }

      ai.disabled = false; ai.textContent = "Перекласти через ШІ (ключ API)";
      showManual(song, e && e.code === "not_granted" ? "Ключ API не підійшов. Перевір його в налаштуваннях або скористайся чатом." : "Не вдалося отримати переклад. Спробуй ще раз або через чат.", done);
    }
  };
}
function showManual(song, msg, done) {
  const box = document.getElementById("manual");

  box.innerHTML = `<div class="card">

    catch (e) { const r = document.createRange(); r.selectNodeContents(document.getElementById("ptext")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Виділив текст, скопіюй вручну"; }

  box.scrollIntoView({ behavior: "smooth", block: "start" });

    ${wordChips ? `<div class="stack"><span class="label">Слова цього рядка</span><div class="chips">${wordChips}</div></div>` : ""}`);
  const kar = karaokeFor(document.getElementById("kar"));
  wireAudio(app, kar);
  const nudge = d => { s.adj = s.adj || {}; s.adj[SES.idx] = Math.round(((s.adj[SES.idx] || 0) + d) * 10) / 10; save(); playLine(SES.idx, { onTick: kar, onEnd: () => kar(-1) }); };
  const e1 = document.getElementById("earlier"), e2 = document.getElementById("later");

}

/* intro: hear the word, then its syllables, then put it back together */

/* shared multiple-choice: auto-checked, wrong answers come back at the end */
function choiceStep(st, { kind, title, promptHtml, options, correct, onDone, afterRender }) {
  lessonFrame(`<div class="stack"><span class="kind">${esc(kind)}${againTag(st)}</span><h2>${esc(title)}</h2></div>
    <div class="card" style="align-items:center;text-align:center">${promptHtml}</div>
    <div class="opts">${options.map((o, i) => `<button class="opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>`);

  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {

    if (!ok) { b.classList.add("no"); requeue(st); }
    score(ok); onDone(ok);
    verdict(ok, ok ? "Так!" : "Ні, правильно: " + correct, "", !ok && !st.again);

}
function ensureDistractors(song, words) {
  if (!SAMPLE) return;
  words.filter(w => w.ua && !w.dUa && !w._asking).forEach(w => {
    w._asking = true;
    const line = (song.lines.find(l => l.words.includes(w)) || {}).en || "";
    SAMPLE.json(`Слово з пісні: "${w.w}", значення тут: "${w.ua}", рядок: "${line}". Для тесту новачку дай JSON {"ua":[...],"en":[...]}.
"ua": 3 НЕправильні українські варіанти перекладу, тієї ж частини мови й схожої форми, правдоподібні, щоб не можна було вгадати методом виключення (для "tell"="сказати": "спитати","почути","покликати"; для "closure"="завершення": "закриття","спокій","прощання"), але жоден не означає "${w.ua}".
"en": 3 англійські слова, схожі на "${w.w}" за звучанням чи написанням (для "closure": "closer","clothes","close"; для "never": "ever","nether","clever").`, { modelTier: "quick" })
      .then(r => {
        const ua = (r && Array.isArray(r.ua) ? r.ua : []).map(x => String(x).trim().slice(0, 40)).filter(x => x && x !== w.ua).slice(0, 3);
        const en = (r && Array.isArray(r.en) ? r.en : []).map(x => toks(x)[0] || "").filter(x => x && x !== w.w).slice(0, 3);
        if (ua.length === 3) w.dUa = ua; if (en.length === 3) w.dEn = en; delete w._asking; save();

}
function uaOptions(w, song) {

  const pool = new Set(); song.lines.forEach(l => l.words.forEach(x => { if (x.ua && x.ua !== w.ua) pool.add(x.ua); }));
  Object.values(S.words).forEach(r => { if (r.ua && r.ua !== w.ua) pool.add(r.ua); });
  const end2 = w.ua.slice(-2);
  let d = shuffle([...pool]).sort((a, b) => (b.slice(-2) === end2) - (a.slice(-2) === end2) || Math.abs(a.length - w.ua.length) - Math.abs(b.length - w.ua.length)).slice(0, 3); for (const u of shuffle(UA_POOL)) { if (d.length >= 3) break; if (u !== w.ua && !d.includes(u)) d.push(u); }

}

  let d = shuffle(pool).sort((a, b) => lev(a, w.w) - lev(b, w.w)).slice(0, 3);
  for (const u of shuffle(EN_POOL)) { if (d.length >= 3) break; if (u !== w.w && !d.includes(u)) d.push(u); }
  return shuffle([w.w, ...d]);
}
function afterChoice(st, ok) {

}
function stepPickUa(st) {

  choiceStep(st, { kind: st.review ? "Повторення" : "Впізнай слово", title: "Що означає це слово?",
    promptHtml: `<div class="bigword">${esc(w.w)}</div>${canSpeak() ? `<button class="speak" data-say="${esc(w.w)}">${ICON_SPEAK}Послухати</button>` : ""}`,
    options: uaOptions(w, song), correct: w.ua, onDone: ok => afterChoice(st, ok) });

    options: enOptions(w, song), correct: w.w, onDone: ok => afterChoice(st, ok) });

/* build: tap word tiles in order while the line plays */
function stepBuild(st) {
  const l = sesLine(); const parts = splitLine(l.en);
  const wi = []; for (let i = 1; i < parts.length; i += 2) wi.push(i);
  let win = wi;
  if (wi.length > 8) {
    let p = st.target ? wi.findIndex(i => toks(parts[i])[0] === st.target) : 0; if (p < 0) p = 0;
    const start = Math.max(0, Math.min(p - 3, wi.length - 7)); win = wi.slice(start, start + 7);
  }
  const before = parts.slice(0, win[0]).join(""), after = parts.slice(win[win.length - 1] + 1).join("");
  const expected = win.map(i => parts[i]);
  const tiles = shuffle(expected.map((t, k) => ({ t, k })));
  const chosen = [];
  lessonFrame(`<div class="stack"><span class="kind">Збери рядок${againTag(st)}</span><h2>Послухай і склади слова по порядку</h2></div>
    <div class="card">${lineButtons(SES.idx, l.en)}
      ${l.ua ? `<p class="small muted">${esc(l.ua)}</p>` : ""}
      ${before.trim() ? `<div class="fixed">${esc(before)}…</div>` : ""}
      <div class="slots" id="slots"></div>
      ${after.trim() ? `<div class="fixed">…${esc(after)}</div>` : ""}
    </div>
    <div class="tiles" id="bank">${tiles.map((x, j) => `<button class="tile" data-j="${j}">${esc(x.t)}</button>`).join("")}</div>`);
  wireAudio();
  const slots = document.getElementById("slots");
  const redraw = () => {
    slots.innerHTML = chosen.map((j, pos) => `<button class="tile" data-pos="${pos}">${esc(tiles[j].t)}</button>`).join("");
    app.querySelectorAll("#bank .tile").forEach(b => b.classList.toggle("used", chosen.includes(Number(b.dataset.j))));
    slots.querySelectorAll(".tile").forEach(b => b.onclick = () => { chosen.splice(Number(b.dataset.pos), 1); redraw(); });
    document.getElementById("chk").disabled = chosen.length !== tiles.length;
  };
  app.querySelectorAll("#bank .tile").forEach(b => b.onclick = () => { const j = Number(b.dataset.j); if (!chosen.includes(j)) { chosen.push(j); redraw(); } });
  setBar(`<button class="btn" id="chk" disabled>Перевірити</button>`);
  document.getElementById("chk").onclick = () => {
    const marks = chosen.map((j, pos) => same(tiles[j].t, expected[pos]));
    const ok = marks.every(Boolean);
    slots.querySelectorAll(".tile").forEach((b, pos) => { b.disabled = true; b.classList.add(marks[pos] ? "ok" : "no"); });
    app.querySelectorAll("#bank .tile").forEach(b => b.disabled = true);
    score(ok); if (!ok) requeue(st);
    const s = sesSong(); expected.forEach(t => { const w = toks(t)[0]; if (w) bumpWord(s, w, ok ? 0.1 : 0); }); save();
    verdict(ok, ok ? "Рядок зібрано!" : "Порядок інший:", ok ? "" : `<div class="tr">${esc(expected.join(" "))}</div>`, !ok && !st.again);
  };
}

/* type from memory: near-miss shows where the mistake is and gives a second try */
/* one more correct letter per tap, starting from where the learner went wrong */
function letterHint(inp, target, cut) {
  const want = cut ? target.slice(target.length - cut) : target;
  const v = inp.value.toLowerCase(); let k = 0;
  while (k < v.length && k < want.length && v[k] === want[k].toLowerCase()) k++;
  inp.value = want.slice(0, Math.min(want.length, k + 1));
  inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
  inp.classList.add("hinted"); setTimeout(() => inp.classList.remove("hinted"), 500);
}
function endCut(w) { return w.length >= 8 ? 3 : w.length >= 5 ? 2 : 0; }
function stepTypeEn(st) {
  const w = st.w; const r = st.review; const s = sesSong();
  const cut = st.ending ? endCut(w.w) : 0;
  const prompt = w.ua || "(без перекладу) слово з рядка: " + lineTextFor(st).replace(new RegExp("\\b" + w.w + "\\b", "i"), "____");
  lessonFrame(`<div class="stack"><span class="kind">${r ? "Повторення" : st.ending ? "Закінчення слова" : st.recap ? "Ще раз з пам'яті" : "Згадай слово"}${againTag(st)}</span><h2>${cut ? "Допиши кінець слова" : "Напиши англійською"}</h2></div>
    <div class="card"><div class="tr" style="font-size:22px">${esc(prompt)}</div>
    ${cut ? `<div class="row" style="gap:4px;flex-wrap:nowrap"><span class="bigword" style="font-size:28px">${esc(w.w.slice(0, w.w.length - cut))}</span><input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${"_".repeat(cut)}" style="width:${cut + 3}ch;font-size:24px;font-weight:800"></div>` : `<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="англійською…">`}
    <div id="fb"></div>
    <div class="row"><button class="linkbtn" id="hint">Підказка: +1 буква</button></div></div>`);
  const inp = document.getElementById("ans"); inp.focus();
  const target = cut ? w.w.slice(w.w.length - cut) : w.w;
  let hinted = false, tries = 0;
  const hintText = () => w.w[0] + " " + "_ ".repeat(Math.max(0, w.w.length - 1)).trim() + (w.say ? "  ·  " + w.say : "");
  document.getElementById("hint").onclick = () => { hinted = true; letterHint(inp, w.w, cut); };
  const sid = r ? r.song : s.id;
  const done = (ok, firstTry) => {
    inp.disabled = true; score(ok, ok && (!firstTry || hinted));
    if (!st.again && !st.ending && !st.recap) srs(sid, w, ok, r ? r.line : SES.idx, ok && (!firstTry || hinted));
    else bumpWord(S.songs[sid], w.w, ok ? 0.05 : -0.05);
    if (!ok) requeue(st);
    save();
    verdict(ok, ok ? (firstTry && !hinted ? "Правильно!" : "Правильно, з другої спроби") : "Правильно буде:",
      ok ? "" : `<div class="bigword" style="font-size:24px">${esc(w.w)}</div><div class="small">Ти написав: ${diffHtml(inp.value, target)}</div>`, !ok && !st.again);
  };
  const check = () => {
    if (!inp.value.trim() || inp.disabled) { inp.focus(); return; }
    tries++;
    if (same(inp.value, target)) return done(true, tries === 1);
    if (tries === 1) {
      const isNear = near(inp.value, target);
      document.getElementById("fb").innerHTML = `<div class="hintbox">${isNear ? `<b>Майже! Помилка тут:</b> ${diffHtml(inp.value, target)}<span class="muted small">Виправ і перевір ще раз. «Підказка» додасть правильну букву з місця помилки.</span>` : `<b>Не те слово. Ще одна спроба.</b><span class="muted small">Тапни «Підказка», щоб отримати першу букву.</span>`}</div>`;
      inp.focus(); try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
      document.getElementById("chk").textContent = "Спробувати ще раз";
      return;
    }
    done(false, false);
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
  setBar(`<button class="btn" id="chk">Перевірити</button>`);
  document.getElementById("chk").onclick = check;
}

/* gaps: level 0 → 1 gap, 1 → 2 gaps, 2 → half, 3+ → whole line. Spiral = previous line + this one. Second try for wrong gaps. */
function splitLine(text) { return String(text).split(/([A-Za-z0-9'’]+)/); }
function pickGaps(parts, count, prefer) {
  const idxs = []; for (let i = 1; i < parts.length; i += 2) idxs.push(i);
  if (count >= idxs.length) return new Set(idxs);
  const pref = shuffle(idxs.filter(i => prefer.has(toks(parts[i])[0])));
  const content = shuffle(idxs.filter(i => !prefer.has(toks(parts[i])[0]) && !STOP.has(toks(parts[i])[0])));
  const rest = shuffle(idxs.filter(i => !pref.includes(i) && !content.includes(i)));
  return new Set([...pref, ...content, ...rest].slice(0, Math.max(1, count)));
}
function gapCount(level, n) { return level <= 0 ? 1 : level === 1 ? 3 : level === 2 ? Math.ceil(n / 2) : n; }
function studiedIn(song, text, also) { return new Set(toks(text).filter(w => S.words[wkey(song.id, w)] || (also && also.has(w)))); }
function pickStudiedGaps(parts, count, studied, level) {
  if (level >= 2) return pickGaps(parts, count, studied);
  if (level === 1) {
    const out = new Set(); const w = []; for (let i = 1; i < parts.length; i += 2) w.push(i);
    w.forEach((i, k) => { if (studied.has(toks(parts[i])[0])) { out.add(i); [w[k - 1], w[k + 1]].forEach(j => { if (j && STOP.has(toks(parts[j])[0])) out.add(j); }); } });
    if (out.size) return out;
  }
  const idxs = []; for (let i = 1; i < parts.length; i += 2) if (studied.has(toks(parts[i])[0])) idxs.push(i);
  return new Set(shuffle(idxs).slice(0, Math.max(1, Math.min(count, idxs.length))));
}
function stepGaps(spiral, whole) {
  const s = sesSong(), l = sesLine(), lp = s.lp[SES.idx];
  const rows = [];
  if (whole) rows.push({ text: l.en, n: 999, studied: new Set(toks(l.en)), level: 3 });
  else if (spiral) {
    const pi = SES.idx - 1, pl = s.lines[pi], plp = s.lp[pi] || { level: 0 };
    rows.push({ text: pl.en, n: 1, studied: studiedIn(s, pl.en), level: 0, prev: true });
    rows.push({ text: l.en, n: 1, studied: studiedIn(s, l.en, new Set(l.words.map(w => w.w))), level: 0 });
  } else rows.push({ text: l.en, n: gapCount(lp.level, toks(l.en).length), studied: studiedIn(s, l.en, new Set(l.words.map(w => w.w))), level: lp.level });
  let gi = 0;
  const html = rows.map(r => {
    const parts = splitLine(r.text); const g = r.studied.size || r.level >= 3 ? pickStudiedGaps(parts, r.n, r.studied, r.level) : new Set(); r.parts = parts; r.gaps = g;
    return `<div class="lyric ${r.prev ? "prev" : ""}">${parts.map((p, i) => g.has(i) ? `<input class="gap" id="g${gi++}" data-ans="${esc(p)}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(3, p.length)}" ${whole && lp.level < 2 ? `placeholder="${esc(p[0])}${"·".repeat(Math.max(0, p.length - 1))}"` : ""} aria-label="пропущене слово">` : esc(p)).join("")}</div>`;
  }).join("");
  const full = rows.every(r => r.gaps.size >= Math.floor(r.parts.length / 2));
  const audioBtns = spiral ? (hasLineAudio(SES.idx - 1) && hasLineAudio(SES.idx) ? `<div class="audiorow"><button class="speak" id="both">${ICON_PLAY}Обидва рядки з пісні</button></div>` : canSpeak() ? `<div class="audiorow"><button class="speak" data-say="${esc(rows[0].text + ". " + rows[1].text)}">${ICON_SPEAK}Голосом</button></div>` : "") : lineButtons(SES.idx, l.en);
  lessonFrame(`<div class="stack"><span class="kind">${whole ? "Весь рядок" : spiral ? "Повернення" : "Пропуски"}</span><h2>${whole ? "Напиши весь рядок, кожне слово" + (lp.level < 2 ? " (перші букви підказано)" : "") : spiral ? "Попередній рядок і новий разом" : full ? "Напиши рядок з пам'яті" : hasLineAudio(SES.idx) ? "Впиши слово, поки грає пісня" : "Впиши пропущені слова"}</h2></div>
    <div class="card">${html}${audioBtns}<div id="fb"></div><button class="linkbtn" id="ghint" style="align-self:flex-start">Підказка: +1 буква</button></div>
    <p class="muted small">${spiral ? "Так старе тримається разом з новим, як куплет у пісні." : "Пиши так, як чуєш у пісні. Великі літери й апострофи не важливі."}</p>`);
  wireAudio();
  const both = document.getElementById("both");
  if (both) both.onclick = () => { const a = lineSpan(s, SES.idx - 1), b = lineSpan(s, SES.idx); if (a && b) playRange(a.start, Math.max(a.end, b.end), { btn: both }); };
  const inputs = [...app.querySelectorAll(".gap")];
  inputs.forEach((inp, k) => inp.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); const nx = inputs.slice(k + 1).find(x => !x.disabled); if (nx) nx.focus(); else check(); } }));
  if (!inputs.length) return next();
  if (inputs[0]) inputs[0].focus();
  let lastGap = inputs[0];
  inputs.forEach(inp => inp.addEventListener("focus", () => { lastGap = inp; }));
  document.getElementById("ghint").onclick = () => { const g = lastGap && !lastGap.disabled ? lastGap : inputs.find(x => !x.disabled); if (g) { letterHint(g, g.dataset.ans, 0); SES.gapsClean = false; } };
  if (!spiral && hasLineAudio(SES.idx)) {
    const loopBtn = document.createElement("button"); loopBtn.className = "speak"; loopBtn.id = "loop"; loopBtn.innerHTML = ICON_PLAY + "Грати по колу";
    app.querySelector(".card .audiorow").prepend(loopBtn);
    const startLoop = () => playLine(SES.idx, { loops: 50, btn: loopBtn });
    loopBtn.onclick = () => { if (play.btn === loopBtn) { stopAudio(); loopBtn.innerHTML = ICON_PLAY + "Грати по колу"; } else { startLoop(); loopBtn.innerHTML = ICON_PLAY + "Грає по колу · стоп"; } };
  }
  let round = 0, firstOk = 0;
  const check = () => {
    round++; stopAudio();
    const open = inputs.filter(x => !x.disabled);
    const wrong = [];
    open.forEach(inp => {
      const good = same(inp.value, inp.dataset.ans);
      if (good) { inp.disabled = true; inp.classList.remove("retry"); inp.classList.add("ok"); const w = toks(inp.dataset.ans)[0]; if (w) bumpWord(s, w, round === 1 ? 0.34 : 0.2); if (round === 1) firstOk++; }
      else wrong.push(inp);
    });
    if (wrong.length && round === 1) {
      wrong.forEach(inp => inp.classList.add("retry"));
      document.getElementById("fb").innerHTML = `<div class="hintbox"><b>${inputs.length - wrong.length} з ${inputs.length}. Виправ виділене:</b>${wrong.map(inp => inp.value.trim() ? (near(inp.value, inp.dataset.ans) ? `<span>майже: ${diffHtml(inp.value, inp.dataset.ans)}</span>` : `<span class="muted">«${esc(inp.value)}» не те слово, починається на «${esc(inp.dataset.ans[0])}»</span>`) : `<span class="muted">порожньо, починається на «${esc(inp.dataset.ans[0])}»</span>`).join("")}</div>`;
      wrong[0].focus(); try { wrong[0].setSelectionRange(wrong[0].value.length, wrong[0].value.length); } catch (e) {}
      document.getElementById("chk").textContent = "Спробувати ще раз";
      return;
    }
    wrong.forEach(inp => {
      inp.disabled = true; inp.classList.remove("retry"); inp.classList.add("no");
      const f = document.createElement("span"); f.className = "fix"; f.textContent = " " + inp.dataset.ans; inp.after(f);
      const w = toks(inp.dataset.ans)[0]; if (w) bumpWord(s, w, -0.1);
    });
    document.getElementById("fb").innerHTML = "";
    const allOk = !wrong.length;
    SES.total += inputs.length; SES.right += inputs.length - wrong.length;
    if (!SES.steps[SES.i].again) { SES.fTotal += inputs.length; SES.fRight += firstOk + (inputs.length - wrong.length - firstOk) * 0.5; }
    if (!(allOk && round === 1) && !spiral && !whole) SES.gapsClean = false;
    if (whole) toks(l.en).forEach(x => bumpWord(s, x, 0));
    if (spiral && allOk && round === 1) { const plp = s.lp[SES.idx - 1]; if (plp && plp.level < 3) plp.level++; }
    if (!allOk) requeue(SES.steps[SES.i]);
    save();
    verdict(allOk, allOk ? (round === 1 ? "Все правильно!" : "Виправив, молодець!") : `${inputs.length - wrong.length} з ${inputs.length}. Глянь виправлення вище.`, "", !allOk && !SES.steps[SES.i].again);
  };
  setBar(`<button class="btn" id="chk">Перевірити</button>`);
  document.getElementById("chk").onclick = check;
}

/* sing */
let listening = false, srObj = null;
function stopListening() {
  if (DICT && listening) { try { DICT.stop().catch(() => {}); } catch (e) {} }
  if (srObj) { try { srObj.abort(); } catch (e) {} srObj = null; }
  listening = false; dictHandlers = { partial: null, final: null, state: null };
}
function scoreSung(lineText, heard) {
  const target = toks(lineText), got = toks(heard); const used = new Array(got.length).fill(false);
  const marks = target.map(t => { const j = got.findIndex((g, k) => !used[k] && (same(g, t) || (t.length >= 5 && near(g, t)))); if (j >= 0) { used[j] = true; return true; } return false; });
  return { marks, score: target.length ? marks.filter(Boolean).length / target.length : 0 };
}
function stepSing() {
  const s = sesSong(), l = sesLine(), lp = s.lp[SES.idx];
  const fromMemory = lp.level >= 2;
  const parts = splitLine(l.en);
  const shown = fromMemory ? parts.map((p, i) => i % 2 === 1 && i > 1 ? "_".repeat(Math.min(6, p.length)) : p).join("") : l.en;
  const micOk = !!DICT || !!BrowserSR;
  lessonFrame(`<div class="stack"><span class="kind">Співаємо</span><h2>${fromMemory ? "Заспівай рядок по пам'яті" : "Послухай і заспівай рядок"}</h2></div>
    <div class="card"><div class="lyric sungline" id="sung">${esc(shown)}</div>
      ${lineButtons(SES.idx, l.en)}${fromMemory ? `<button class="linkbtn" id="peek">Підглянути</button>` : ""}</div>
    ${micOk ? `<button class="mic" id="mic" aria-label="Почати запис">${ICON_MIC}</button><p class="heard" id="heard">Спершу послухай, потім натисни мікрофон і співай. Натисни ще раз, коли закінчиш.</p>`
      : `<div class="note small">Мікрофон тут недоступний (найкраще працює в Chrome). Заспівай рядок вголос і оціни себе.</div>`}
    <p class="muted small">Перевірка показує, які слова розпізнались. Це не оцінка акценту.</p>`);
  wireAudio();
  const peek = document.getElementById("peek"); if (peek) peek.onclick = () => { document.getElementById("sung").textContent = l.en; peek.remove(); };
  const finish = (sc, self) => { SES.sing = sc; lp.best = Math.max(lp.best || 0, self ? Math.min(0.7, sc) : sc); if (!self) lp.micBest = Math.max(lp.micBest || 0, sc); save(); };
  const selfRate = () => {
    setBar(`<div class="verdict" style="color:var(--ink)">Як вийшло?</div><div class="two"><button class="btn ghost" data-v="0.3">Важко</button><button class="btn ghost" data-v="0.6">Майже</button></div><button class="btn good" data-v="0.9">Легко, все заспівав</button>`);
    barin.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { finish(Number(b.dataset.v), true); next(); });
  };
  if (!micOk) { keyboardSing(""); return; }
  const mic = document.getElementById("mic"), heard = document.getElementById("heard");
  let text = "", partial = "";
  const keyboardSing = why => {
    stopListening();
    if (mic) mic.hidden = true;
    const box = document.createElement("div"); box.className = "card";
    box.innerHTML = `${why ? `<div class="warn small">${esc(why)}</div>` : ""}<b>Заспівай через клавіатуру телефона</b><p class="small muted">Тапни поле нижче, на клавіатурі натисни значок мікрофона, переключи мову диктування на English і заспівай рядок. Клавіатура сама запише слова.</p><textarea id="kbd" style="min-height:80px" autocapitalize="off" spellcheck="false" placeholder="тут з'явиться те, що ти заспівав"></textarea>`;
    (heard || app.lastElementChild).after(box);
    setBar(`<button class="btn" id="kchk">Перевірити</button><button class="linkbtn" id="selfr2" style="align-self:center">Пропустити (без зарахування)</button>`);
    document.getElementById("kchk").onclick = () => { const v = document.getElementById("kbd").value.trim(); if (!v) { document.getElementById("kbd").focus(); return; } text = v; partial = ""; evaluate(); };
    document.getElementById("selfr2").onclick = () => { SES.sing = null; next(); };
  };
  const show = () => { heard.textContent = (text + " " + partial).trim() || "Слухаю…"; };
  const evaluate = () => {
    const res = scoreSung(l.en, text + " " + partial);
    const t = toks(l.en); let k = 0;
    document.getElementById("sung").innerHTML = splitLine(l.en).map((p, i) => i % 2 === 1 ? `<span class="w ${res.marks[k++] ? "hit" : "miss"}">${esc(p)}</span>` : esc(p)).join("");
    t.forEach((w, i) => { if (res.marks[i]) bumpWord(s, w, 0.15); });
    finish(res.score, false);
    const pct = Math.round(res.score * 100); const good = res.score >= 0.7;
    setBar(`<div class="verdict">${good ? "Класно! " : ""}Розпізнано ${pct}% слів</div><div class="two"><button class="btn ghost" id="again">Ще раз</button><button class="btn ${good ? "good" : ""}" id="cont">Далі</button></div>`, good ? "ok" : "no");
    document.getElementById("again").onclick = () => stepSing();
    document.getElementById("cont").onclick = next;
  };
  const setLive = on => { listening = on; mic.classList.toggle("live", on); mic.setAttribute("aria-label", on ? "Зупинити запис" : "Почати запис"); };
  setBar(`<button class="linkbtn" id="selfr" style="align-self:center">Не можу записати, оціню себе сам</button>`);
  document.getElementById("selfr").textContent = "Мікрофон не працює? Заспівай через клавіатуру";
  document.getElementById("selfr").onclick = () => keyboardSing("");
  mic.onclick = () => {
    if (listening) {
      if (DICT) { DICT.stop().then(() => { setLive(false); evaluate(); }).catch(() => { setLive(false); evaluate(); }); }
      else if (srObj) { try { srObj.stop(); } catch (e) {} }
      return;
    }
    text = ""; partial = "";
    if (DICT) {
      dictHandlers.partial = t => { partial = t; show(); };
      dictHandlers.final = t => { text = (text + " " + t).trim(); partial = ""; show(); };
      dictHandlers.state = (state, reason) => { if (state === "idle" && listening) { setLive(false); if (reason && reason !== "stopped" && reason !== "viewer_stopped" && !text) heard.textContent = "Запис зупинився. Натисни мікрофон ще раз."; else evaluate(); } };
      DICT.start({ language: "en" }).catch(e => {
        setLive(false);
        keyboardSing(e && e.code === "not_granted" ? "Доступ до мікрофона для цієї сторінки вимкнено." : "Мікрофон сторінки тут не запустився (" + ((e && e.code) || "помилка") + ").");
      });
      stopAudio(); setLive(true); show();
      return;
    }
    try {
      stopAudio();
      srObj = new BrowserSR(); srObj.lang = "en-US"; srObj.interimResults = true; srObj.continuous = true;
      srObj.onresult = e => { let f = "", p = ""; for (let i = 0; i < e.results.length; i++) { if (e.results[i].isFinal) f += " " + e.results[i][0].transcript; else p += " " + e.results[i][0].transcript; } text = f.trim(); partial = p.trim(); show(); };
      srObj.onerror = ev => { setLive(false); srObj = null; keyboardSing("Мікрофон сторінки тут не запустився (" + ((ev && ev.error) || "помилка") + ")."); };
      srObj.onend = () => { if (listening) { setLive(false); srObj = null; evaluate(); } };
      srObj.start(); setLive(true); show();
    } catch (e) { setLive(false); keyboardSing("Мікрофон сторінки тут не запустився."); }
  };
}

/* retell / own sentence (alternates by session), checked by AI when it is available */
function stepRetell() {
  const s = sesSong(), l = sesLine(), lp = s.lp[SES.idx];
  const own = (lp.sessions % 2 === 1) || !l.ua;
  const w = l.words[0];
  if (own && w) {
    lessonFrame(`<div class="stack"><span class="kind">Своє речення</span><h2>Склади речення зі словом «${esc(w.w)}»</h2></div>
      <div class="card"><p class="muted small">Про себе, своє життя чи будь-що. Можна дуже просто: 2–4 слова. ${w.ua ? `«${esc(w.w)}» означає «${esc(w.ua)}».` : ""}</p>
      <input type="text" id="ans" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="наприклад: I am not a ${esc(w.w)}">
      <div id="fb"></div></div>`);
    const inp = document.getElementById("ans");
    setBar(`<button class="btn" id="chk">${SAMPLE ? "Перевірити" : "Готово"}</button><button class="linkbtn" id="skip" style="align-self:center">Пропустити</button>`);
    document.getElementById("skip").onclick = next;
    document.getElementById("chk").onclick = async () => {
      const t = inp.value.trim(); if (!t) { inp.focus(); return; }
      const hasW = toks(t).some(x => same(x, w.w) || near(x, w.w));
      if (!SAMPLE) { verdict(hasW, hasW ? "Зараховано! Скажи його вголос" : `Додай у речення слово «${w.w}»`); if (hasW) bumpWord(s, w.w, 0.1); save(); return; }
      const b = document.getElementById("chk"); b.disabled = true; b.textContent = "Перевіряю…";
      try {
        const r = await SAMPLE(`Учень з нульовим рівнем англійської склав речення зі словом "${w.w}": "${t}". Відповідай українською, до 35 слів, без вступу: чи правильно; якщо ні, виправлений варіант англійською; одна коротка порада.`, { modelTier: "quick" });
        document.getElementById("fb").innerHTML = `<div class="okbox">${esc(r.text)}</div>`;
        if (hasW) bumpWord(s, w.w, 0.1); save();
        setBar(`<button class="btn good" id="cont">Далі</button>`); document.getElementById("cont").onclick = next;
      } catch (e) { verdict(hasW, hasW ? "Зараховано!" : `Додай у речення слово «${w.w}»`); }
    };
    return;
  }
  lessonFrame(`<div class="stack"><span class="kind">Переказ</span><h2>Про що цей рядок? Своїми словами</h2></div>
    <div class="card"><div class="lyric">${esc(l.en)}</div>${lineButtons(SES.idx, l.en)}
    <textarea id="ans" style="min-height:90px" placeholder="українською, як би пояснив другу"></textarea>
    <div id="fb"></div>
    <div id="cmp" hidden><span class="label">Переклад</span><div class="tr">${esc(l.ua)}</div></div></div>`);
  wireAudio();
  setBar(`<button class="btn" id="chk">Перевірити</button><button class="linkbtn" id="skip" style="align-self:center">Пропустити</button>`);
  document.getElementById("skip").onclick = next;
  document.getElementById("chk").onclick = async () => {
    const t = document.getElementById("ans").value.trim();
    document.getElementById("cmp").hidden = false;
    if (SAMPLE && t) {
      const b = document.getElementById("chk"); b.disabled = true; b.textContent = "Перевіряю…";
      try {
        const r = await SAMPLE(`Рядок пісні: "${l.en}". Правильний зміст: "${l.ua}". Учень-новачок переказав українською: "${t}". Відповідь українською, до 25 слів, без вступу. Перше слово відповіді ТАК, якщо зміст переданий загалом правильно, або НІ.`, { modelTier: "quick" });
        const ok = /^\s*\**так/i.test(r.text);
        document.getElementById("fb").innerHTML = `<div class="${ok ? "okbox" : "warn"}">${esc(r.text)}</div>`;
        if (ok) { toks(l.en).forEach(x => bumpWord(s, x, 0.05)); save(); }
        verdict(ok, ok ? "Зміст зрозумів!" : "Порівняй з перекладом вище");
        return;
      } catch (e) {}
    }
    setBar(`<div class="verdict" style="color:var(--ink)">Зміст збігся?</div><div class="two"><button class="btn ghost" id="no">Не зовсім</button><button class="btn good" id="yes">Так</button></div>`);
    document.getElementById("no").onclick = next;
    document.getElementById("yes").onclick = () => { toks(l.en).forEach(x => bumpWord(s, x, 0.05)); save(); next(); };
  };
}

/* result */
function finishSession() {
  stopAudio();
  const s = sesSong(), lp = s.lp[SES.idx];
  lp.sessions++;
  if (SES.gapsClean && lp.level < 3) lp.level++;
  const acc = SES.fTotal ? SES.fRight / SES.fTotal : 1;
  lp.lastAcc = acc;
  const passed = acc >= 0.75;
  if (passed && SES.isNew && SES.idx === s.next) s.next++;
  bumpStreak(); save();
  const after = songPct(s), before = SES.before, idx = SES.idx;
  const doneAll = s.next >= s.lines.length;
  app.innerHTML = `
  <div class="stack" style="text-align:center;padding-top:12px"><span class="kind">Сесію завершено</span><h1>${!passed ? "Ще трохи, і рядок твій" : SES.missed === 0 ? "Чисто, без жодної помилки!" : "Ще один рядок у тебе в голові"}</h1></div>
  <div class="card resultpct">
    <span class="label">${esc(s.artist)} — ${esc(s.title)}</span>
    <div class="pct" id="cnt">${fmtPct(before)}<small>%</small></div>
    <div class="delta">+${fmtPct(Math.max(0, after - before))}%</div>
    <div class="progressline"><div id="pl" style="width:${before}%"></div></div>
  </div>
  <div class="stats">
    <div class="stat"><b>${SES.right}/${SES.total}</b><span>правильних відповідей</span></div>
    <div class="stat"><b>${SES.sing == null ? "—" : Math.round(SES.sing * 100) + "%"}</b><span>рядка заспівано</span></div>
    <div class="stat"><b>${SES.fresh}</b><span>нових слів</span></div>
    <div class="stat"><b>${streakNow()}</b><span>${plural(streakNow(), "день", "дні", "днів")} поспіль</span></div>
  </div>
  <div class="card" style="gap:8px"><div class="row" style="justify-content:space-between"><b>Рядок пройдено на ${Math.round(acc * 100)}%</b><span class="badge ${passed ? "on" : ""}">${passed ? "Далі відкрито" : "Треба 75%"}</span></div><div class="progressline"><div style="width:${Math.round(acc * 100)}%;background:${passed ? "var(--good)" : "var(--sun)"}"></div></div><p class="small muted">${passed ? "Добре закріпив. Можна йти до наступного рядка." : "Повторимо цей рядок ще раз, поки слова не сядуть. Рахуються відповіді з першої спроби."}</p></div>
  <p class="lessons-left">Слова з цієї сесії повернуться завтра. ${lp.level >= 3 ? "Цей рядок ти вже пишеш повністю з пам'яті." : "Наступного разу в рядку буде більше пропусків."}</p>`;
  setBar(passed ? `<button class="btn sun" id="more">${doneAll ? "Ще один рядок" : `Наступний рядок (${s.next + 1}/${s.lines.length})`}</button><div class="two"><button class="btn ghost" id="repeat">Цей рядок ще раз</button><button class="btn ghost" id="home">На головну</button></div>`
    : `<button class="btn sun" id="repeat">Повторити цей рядок</button><button class="btn ghost" id="home">На головну</button>`);
  const more = document.getElementById("more"); if (more) more.onclick = () => startSession();
  document.getElementById("repeat").onclick = () => startSession(idx);
  document.getElementById("home").onclick = route;
  const cnt = document.getElementById("cnt"), pl = document.getElementById("pl");
  const t0 = performance.now(), dur = 1100;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const tick = now => {
    const k = reduce ? 1 : Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - k, 3);
    const v = before + (after - before) * e;
    cnt.innerHTML = fmtPct(v) + "<small>%</small>"; pl.style.width = v + "%";
    if (k < 1) requestAnimationFrame(tick);
  };
  setTimeout(() => requestAnimationFrame(tick), 300);
  SES = null; VIEW = "result";
}

window.__ryadok = { parseLyrics, scoreSung, same, near, diffHtml, songPct, syllabify };
route();
})();
</script>
